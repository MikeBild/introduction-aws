# The default auth mode is the API key. Once IAM is added as a second mode:
# A type without a directive is reachable with the default mode only. With a directive,
# only the listed modes count – which is why both are listed here.

type OrderItem @aws_api_key @aws_iam {
  productId: String!
  quantity: Int!
  priceCents: Int!
}

type Order @aws_api_key @aws_iam {
  id: ID!
  customerId: ID!
  items: [OrderItem!]!
  createdAt: AWSDateTime!
}

input OrderItemInput {
  productId: String!
  quantity: Int!
  priceCents: Int!
}

input CreateOrderInput {
  customerId: ID!
  items: [OrderItemInput!]!
}

type Query @aws_api_key @aws_iam {
  order(id: ID!): Order
}

type Mutation @aws_api_key @aws_iam {
  createOrder(input: CreateOrderInput!): Order!
}

type Subscription @aws_api_key @aws_iam {
  onOrderCreated: Order @aws_subscribe(mutations: ["createOrder"])
}
